<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeroHub - Key Kích Hoạt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0c10;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(108, 92, 231, 0.18) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(255, 120, 0, 0.12) 0%, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card {
            width: 100%;
            background: #12141a;
            border: 1px solid #1f232d;
            border-radius: 24px;
            padding: 28px 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #ff4757, #6c5ce7, #00d2d3);
        }

        .app-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #6c5ce7, #ff4757);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            margin-bottom: 16px;
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .brand-subtitle {
            font-size: 11px;
            font-weight: 800;
            color: #6c5ce7;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .card-title {
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .card-desc {
            font-size: 13px;
            color: #8b92a3;
            margin-bottom: 22px;
        }

        .key-box {
            width: 100%;
            background: #161922;
            border: 1px dashed #2f364a;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .key-label {
            font-size: 11px;
            font-weight: 800;
            color: #7a8294;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .key-value {
            font-size: 15px;
            font-weight: 800;
            color: #54a0ff;
            word-break: break-all;
            letter-spacing: 0.5px;
        }

        .tags-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 22px;
            width: 100%;
        }

        .tag {
            background: #161922;
            border: 1px solid #202532;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #a4b0be;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tag.status {
            background: rgba(46, 213, 115, 0.1);
            border-color: rgba(46, 213, 115, 0.3);
            color: #2ed573;
            font-weight: 700;
            width: 100%;
            justify-content: center;
            padding: 8px 14px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #2ed573;
            border-radius: 50%;
            box-shadow: 0 0 8px #2ed573;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            border: none;
            outline: none;
            text-decoration: none;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #54a0ff, #2e86de);
            color: #ffffff;
            box-shadow: 0 6px 20px rgba(46, 134, 222, 0.35);
        }

        .btn-primary:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #161922;
            border: 1px solid #202532;
            color: #8b92a3;
        }

        .btn-secondary:hover {
            background: #1d212d;
            color: #ffffff;
        }

        .instruction-box {
            width: 100%;
            background: rgba(22, 26, 36, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
            text-align: left;
            margin-top: 6px;
        }

        .instruction-title {
            font-size: 12px;
            font-weight: 800;
            color: #ff9f43;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
        }

        .step-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .step-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: #a4b0be;
        }

        .step-num {
            width: 18px;
            height: 18px;
            background: rgba(255, 159, 67, 0.15);
            color: #ff9f43;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 11px;
            flex-shrink: 0;
        }

        .highlight {
            background: rgba(108, 92, 231, 0.2);
            color: #a29bfe;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
        }

        .toast {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: #54a0ff;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 13px;
            box-shadow: 0 10px 25px rgba(84, 160, 255, 0.4);
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }

        .toast.show {
            bottom: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="app-icon">🎮</div>

            <div class="brand-subtitle">WEROHUB</div>
            <h1 class="card-title">Key Kích Hoạt</h1>
            <p class="card-desc">Sao chép key bên dưới và dán vào ứng dụng</p>

            <div class="key-box">
                <div class="key-label">🔑 MÃ KÍCH HOẠT</div>
                <div class="key-value" id="keyValue">WeroHub-77955B09F65G8551</div>
            </div>

            <div class="tags-row">
                <div class="tag status">
                    <span class="dot"></span>
                    Key hợp lệ • Sẵn sàng sử dụng
                </div>
                <div class="tag">⏰ HSD: Vĩnh viễn</div>
                <div class="tag">🏷️ WeroHub</div>
            </div>

            <button class="btn btn-primary" onclick="copyKey()">
                📋 Sao Chép Key
            </button>

            <button class="btn btn-secondary" onclick="goHome()">
                🏠 Về Trang Chủ
            </button>

            <div class="instruction-box">
                <div class="instruction-title">
                    <span>💡 HƯỚNG DẪN</span>
                </div>
                <div class="step-list">
                    <div class="step-item">
                        <span class="step-num">1</span>
                        <span>Mở ứng dụng <span class="highlight">script:WeroHub</span></span>
                    </div>
                    <div class="step-item">
                        <span class="step-num">2</span>
                        <span>Nhấn <span class="highlight">Nhập Key</span></span>
                    </div>
                    <div class="step-item">
                        <span class="step-num">3</span>
                        <span>Dán key vào để <span class="highlight">script kích hoạt</span></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Đã sao chép Key thành công!</div>

    <script>
        function copyKey() {
            const keyText = document.getElementById('keyValue').innerText;

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(keyText).then(() => {
                    showToast();
                }).catch(() => {
                    fallbackCopy(keyText);
                });
            } else {
                fallbackCopy(keyText);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast();
            } catch (err) {
                alert('Không thể sao chép tự động!');
            }
            document.body.removeChild(textArea);
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function goHome() {
            window.location.href = "https://zenikeit.github.io/script/werohub.html";
        }
    </script>
</body>
  </html>
